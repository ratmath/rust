[package]
name = "ratmath"
version = "0.1.0"
edition = "2024"
description = "Rust kernels for RatMath's hot exact arithmetic: rational matrices and certified dyadic intervals, callable from JS (WASM) and Swift (C ABI)"
license = "MIT"
repository = "https://github.com/ratmath/rust"
readme = "README.md"
rust-version = "1.85"

[lib]
name = "ratmath"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
